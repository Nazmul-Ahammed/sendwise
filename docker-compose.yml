services:
  db:
    image: postgres:16-alpine
    container_name: sendwise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sendwise
      POSTGRES_PASSWORD: sendwise
      POSTGRES_DB: sendwise
    ports:
      - "5432:5432"
    volumes:
      - sendwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendwise -d sendwise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sendwise_pgdata:
